<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Phishing-Quiz V2</title>
<style>
:root{--navy:#123b78;--violet:#7434d8;--green:#16834b;--red:#c83b3b;--ink:#15233a;--muted:#657188}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:14px;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:linear-gradient(145deg,#eaf0f9,#f8f9fc)}.app{max-width:680px;margin:auto}h1{margin:4px 0;font-size:clamp(25px,7vw,36px);color:var(--navy)}.subtitle{color:var(--muted)}.track{height:10px;background:#dce3ee;border-radius:99px;overflow:hidden;margin:16px 0 8px}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--navy),var(--violet));transition:.3s}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}.card{background:white;margin-top:16px;padding:clamp(18px,5vw,30px);border-radius:20px;box-shadow:0 14px 38px #20375a1c}.question{font-size:clamp(20px,5.5vw,27px);font-weight:760;line-height:1.3;margin-bottom:20px}.answers{display:grid;gap:12px}button{font:inherit}.answer{width:100%;min-height:56px;padding:14px 15px;text-align:left;background:white;border:2px solid #d7dfeb;border-radius:14px;color:var(--ink);font-size:16px;cursor:pointer}.answer:hover{border-color:#7892c5}.answer:disabled{opacity:1;cursor:default}.correct{background:#e5f6ec!important;border-color:var(--green)!important}.wrong{background:#fdeaea!important;border-color:var(--red)!important}.feedback{min-height:28px;margin-top:16px;font-weight:750}.next,.restart{display:none;width:100%;border:0;border-radius:14px;padding:15px;margin-top:12px;background:var(--navy);color:white;font-weight:750;cursor:pointer}.result{text-align:center}.score{font-size:48px;font-weight:850;color:var(--navy)}.pass{color:var(--green)}.fail{color:var(--red)}.review{text-align:left;margin-top:24px}.review-item{margin:10px 0;padding:12px;border-left:4px solid var(--red);border-radius:8px;background:#fff3f3;font-size:14px}@media(max-width:420px){body{padding:10px}.card{border-radius:16px}}
</style></head><body><main class="app"><h1>🔐 Phishing-Quiz V2</h1><div class="subtitle">25 kompakte Praxisfragen</div><div class="track"><div class="fill" id="fill"></div></div><div class="meta"><span id="progress"></span><span id="points"></span></div><section class="card"><div id="quiz"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Nächste Frage</button></section></main>
<script>
const source=[{"q": "Was ist Phishing?", "a": ["Täuschung zum Datendiebstahl", "Verschlüsselung von Dateien", "Sicherung von Benutzerkonten", "Prüfung von Netzwerkzugängen"], "c": 0}, {"q": "Was kennzeichnet Spear Phishing?", "a": ["Gezielte persönliche Ansprache", "Zufälliger Massenversand", "Angriff nur per Telefon", "Werbung über soziale Medien"], "c": 0}, {"q": "Eine Nachricht fordert sofort Deine Zugangsdaten. Was ist richtig?", "a": ["Forderung zunächst prüfen", "Daten sofort übermitteln", "Nachricht direkt weiterleiten", "Absender telefonisch informieren"], "c": 0}, {"q": "Über welche Wege kann Phishing erfolgen?", "a": ["Nur über E-Mails", "Nur über Webseiten", "Nur über Anrufe", "Über verschiedene Kanäle"], "c": 3}, {"q": "Wie bauen Angreifer häufig Vertrauen auf?", "a": ["Mit harmlosen Vorfragen", "Mit Sicherheitsupdates", "Mit offiziellen Formularen", "Mit verschlüsselten Dateien"], "c": 0}, {"q": "Welches Verhalten ist ein Warnsignal?", "a": ["Zeitdruck und Drohungen", "Eine normale Grußformel", "Eine bekannte Schriftart", "Ein Firmenlogo im Text"], "c": 0}, {"q": "Warum sammeln Angreifer harmlose Informationen?", "a": ["Für glaubwürdigere Angriffe", "Für schnellere Downloads", "Für automatische Updates", "Für größere Postfächer"], "c": 0}, {"q": "Was kann an einer Absenderadresse verdächtig sein?", "a": ["Kleine Schreibfehler", "Eine persönliche Anrede", "Eine übliche Signatur", "Ein kurzer Betreff"], "c": 0}, {"q": "Was bedeutet E-Mail-Spoofing?", "a": ["Absender wird vorgetäuscht", "Anhang wird verschlüsselt", "Nachricht wird archiviert", "Empfänger wird verborgen"], "c": 0}, {"q": "Eine unerwartete Mail enthält einen Link. Was tust Du zuerst?", "a": ["Plausibilität kontrollieren", "Link sofort öffnen", "Mail allen weiterleiten", "Absenderdaten speichern"], "c": 0}, {"q": "Wie prüfst Du am PC ein Linkziel, ohne es zu öffnen?", "a": ["Per Mouse-over", "Per Doppelklick", "Per Weiterleitung", "Per Bildschirmfoto"], "c": 0}, {"q": "Was kann in einem Bild einer E-Mail verborgen sein?", "a": ["Ein gefährlicher Link", "Ein sicheres Kennwort", "Ein Virenscanner", "Ein Backup-Auftrag"], "c": 0}, {"q": "Woran erkennt man eine gefährliche Datei sicher?", "a": ["Oft nicht äußerlich", "Immer an der Endung", "Immer am Dateinamen", "Immer am Dateisymbol"], "c": 0}, {"q": "Wie gehst Du mit einem unerwarteten Anhang um?", "a": ["Nicht ungeprüft öffnen", "Sofort herunterladen", "An Kollegen senden", "Schutzsoftware abschalten"], "c": 0}, {"q": "Welche Dateien können gefährlich sein?", "a": ["Auch PDF- und Office-Dateien", "Nur ausführbare Dateien", "Nur sehr große Dateien", "Nur unbekannte Bilddateien"], "c": 0}, {"q": "Was bedeutet Smishing?", "a": ["Phishing per SMS", "Phishing per Anruf", "Phishing per QR-Code", "Phishing per Videocall"], "c": 0}, {"q": "Eine angebliche Bank-SMS enthält einen Link. Was ist sinnvoll?", "a": ["Bankseite direkt aufrufen", "Link in der SMS öffnen", "SMS an Kontakte senden", "Auf die SMS antworten"], "c": 0}, {"q": "Was bedeutet Quishing?", "a": ["Phishing mit QR-Codes", "Phishing mit Anhängen", "Phishing mit Anrufen", "Phishing mit Passwörtern"], "c": 0}, {"q": "Was prüfst Du vor dem Öffnen eines QR-Links?", "a": ["Zieladresse und Manipulation", "Helligkeit und Bildgröße", "Kamera und Lautstärke", "Farbe und Druckqualität"], "c": 0}, {"q": "Was bedeutet Vishing?", "a": ["Phishing per Telefon", "Phishing per SMS", "Phishing per QR-Code", "Phishing per E-Mail"], "c": 0}, {"q": "Ein unbekannter Anrufer verlangt interne Daten. Was tust Du?", "a": ["Rückruf offiziell prüfen", "Daten teilweise nennen", "Gespräch weiterverbinden", "Private Nummer mitteilen"], "c": 0}, {"q": "Welche Gefahr verstärkt KI beim Vishing?", "a": ["Gefälschte Stimmen", "Schwache Akkus", "Langsame Anrufe", "Verlorene Kontakte"], "c": 0}, {"q": "Woran erkennst Du möglicherweise die Chef-Masche?", "a": ["Dringende vertrauliche Forderung", "Normale Terminabstimmung", "Offizielle Prozessprüfung", "Angekündigter Rückruf"], "c": 0}, {"q": "Wie reagierst Du auf eine angeblich dringende Chef-Anweisung?", "a": ["Vorgang intern verifizieren", "Prozess sofort umgehen", "Zugangsdaten weitergeben", "Zahlung direkt ausführen"], "c": 0}, {"q": "Welche goldene Regel gilt für Zugangsdaten?", "a": ["Niemals weitergeben", "Im Team hinterlegen", "Privat abspeichern", "Per Chat versenden"], "c": 0}];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const questions=shuffle(source.map(x=>{const opts=x.a.map((text,i)=>({text,ok:i===x.c}));return {q:x.q,opts:shuffle(opts)}}));
let current=0,score=0,locked=false;const mistakes=[];const quiz=document.getElementById('quiz'),feedback=document.getElementById('feedback'),next=document.getElementById('next');
const esc=s=>s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function render(){locked=false;feedback.textContent='';next.style.display='none';const x=questions[current];progress.textContent=`Frage ${current+1} von 25`;points.textContent=`Richtig: ${score}`;fill.style.width=`${current/25*100}%`;quiz.innerHTML=`<div class="question">${esc(x.q)}</div><div class="answers">${x.opts.map((o,i)=>`<button class="answer" data-i="${i}">${String.fromCharCode(65+i)}) ${esc(o.text)}</button>`).join('')}</div>`;quiz.querySelectorAll('.answer').forEach(b=>b.onclick=()=>choose(+b.dataset.i))}
function choose(i){if(locked)return;locked=true;const x=questions[current],bs=[...quiz.querySelectorAll('.answer')],right=x.opts.findIndex(o=>o.ok);bs.forEach(b=>b.disabled=true);bs[right].classList.add('correct');if(i===right){score++;feedback.textContent='✅ Richtig'}else{bs[i].classList.add('wrong');feedback.textContent=`❌ Falsch. Richtig: ${x.opts[right].text}`;mistakes.push({q:x.q,chosen:x.opts[i].text,right:x.opts[right].text})}points.textContent=`Richtig: ${score}`;next.style.display='block'}
next.onclick=()=>{current++;current<25?render():finish()};
function finish(){const pct=Math.round(score/25*100),passed=pct>=80;fill.style.width='100%';progress.textContent='Abgeschlossen';points.textContent='';feedback.textContent='';next.style.display='none';quiz.innerHTML=`<div class="result"><h2>Quiz beendet</h2><div class="score">${pct} %</div><p><strong>${score} von 25</strong> richtig</p><h3 class="${passed?'pass':'fail'}">${passed?'✅ Bestanden':'❌ Nicht bestanden'}</h3><p>Bestehensgrenze: 80 %</p><button class="restart" style="display:block" onclick="location.reload()">Neu starten</button>${mistakes.length?`<div class="review"><h3>Fehlerübersicht</h3>${mistakes.map((m,i)=>`<div class="review-item"><strong>${i+1}. ${esc(m.q)}</strong><br>Deine Antwort: ${esc(m.chosen)}<br>Richtig: ${esc(m.right)}</div>`).join('')}</div>`:'<p class="pass">Alle Fragen richtig beantwortet.</p>'}</div>`}
render();
</script></body></html>
